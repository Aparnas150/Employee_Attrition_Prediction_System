<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prediction History | HR Intelligence</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            margin: 0;
            background: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        .sidebar {
            width: 240px;
            height: 100vh;
            background: #111827;
            color: white;
            position: fixed;
            left: 0;
            top: 0;
            padding: 25px 15px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 35px;
            padding-left: 10px;
        }

        .nav-link {
            color: #cbd5e1;
            padding: 13px 15px;
            border-radius: 8px;
            margin-bottom: 8px;
            text-decoration: none;
            display: block;
        }

        .nav-link:hover,
        .nav-link.active {
            background: #2563eb;
            color: white;
        }

        .main {
            margin-left: 240px;
            padding: 35px;
        }

        .page-title {
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .page-subtitle {
            color: #64748b;
            margin-bottom: 30px;
        }

        .card-box {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        .table thead {
            background: #f1f5f9;
        }

        .table th {
            color: #475569;
            font-size: 14px;
            white-space: nowrap;
        }

        .table td {
            vertical-align: middle;
            font-size: 14px;
        }

        .risk-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 12px;
        }

        .risk-low {
            background: #dcfce7;
            color: #166534;
        }

        .risk-medium {
            background: #fef3c7;
            color: #92400e;
        }

        .risk-high {
            background: #fee2e2;
            color: #991b1b;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #64748b;
        }
    </style>
</head>

<body>

    <div class="sidebar">

        <div class="logo">
            HR Intelligence
        </div>

        <a href="index.html" class="nav-link">
            Dashboard
        </a>

        <a href="risk.html" class="nav-link">
            Employee Risk
        </a>

        <a href="history.html" class="nav-link active">
            Prediction History
        </a>

        <a href="analytics.html" class="nav-link">
            Analytics
        </a>

    </div>


    <div class="main">

        <h1 class="page-title">
            Prediction History
        </h1>

        <p class="page-subtitle">
            View previously generated employee attrition risk predictions.
        </p>


        <div class="card-box">

            <div class="table-responsive">

                <table class="table table-hover">

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Age</th>
                            <th>Gender</th>
                            <th>Department</th>
                            <th>Job Role</th>
                            <th>Overtime</th>
                            <th>Job Satisfaction</th>
                            <th>Risk Level</th>
                            <th>Probability</th>
                            <th>Date</th>
                        </tr>
                    </thead>

                    <tbody id="historyTable">

                        <tr>
                            <td colspan="10" class="loading">
                                Loading prediction history...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <script>

        async function loadHistory() {

            try {

                const response = await fetch(
                    "http://127.0.0.1:5000/history"
                );

                const data = await response.json();

                const table =
                    document.getElementById("historyTable");

                table.innerHTML = "";

                if (data.length === 0) {

                    table.innerHTML = `
                        <tr>
                            <td colspan="10" class="loading">
                                No prediction records found.
                            </td>
                        </tr>
                    `;

                    return;
                }


                data.forEach(record => {

                    let riskClass = "";

                    if (record.risk_level === "Low") {
                        riskClass = "risk-low";
                    }
                    else if (record.risk_level === "Medium") {
                        riskClass = "risk-medium";
                    }
                    else {
                        riskClass = "risk-high";
                    }


                    const row = document.createElement("tr");

                    row.innerHTML = `

                        <td>${record.id}</td>

                        <td>${record.age}</td>

                        <td>${record.gender}</td>

                        <td>${record.department}</td>

                        <td>${record.job_role}</td>

                        <td>${record.overtime}</td>

                        <td>${record.job_satisfaction}</td>

                        <td>
                            <span class="risk-badge ${riskClass}">
                                ${record.risk_level}
                            </span>
                        </td>

                        <td>
                            <strong>
                                ${record.attrition_probability}%
                            </strong>
                        </td>

                        <td>
                            ${record.created_at}
                        </td>

                    `;

                    table.appendChild(row);

                });

            }
            catch (error) {

                console.error(error);

                document.getElementById("historyTable").innerHTML = `

                    <tr>
                        <td colspan="10" class="loading">
                            Unable to load prediction history.
                        </td>
                    </tr>

                `;
            }
        }


        loadHistory();

    </script>

</body>
</html>
